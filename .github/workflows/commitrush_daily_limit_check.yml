name: CommitRush Daily Limit Check

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
    branches:
      - main

permissions:
  pull-requests: write
  contents: read

jobs:
  check_daily_limit:
    name: CommitRush Daily Limit Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Evaluate Daily Point Allowance
        id: check_limit
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
        run: |
          python scripts/check_pr_daily_limit.py \
            --author "$PR_AUTHOR" \
            --pr-number "$PR_NUMBER" \
            --title "$PR_TITLE" \
            --body "$PR_BODY" \
            --base-branch "$BASE_BRANCH" \
            --leaderboard-file leaderboard.json \
            --output-file daily_limit_report.md

          # Append to GitHub Actions step summary
          cat daily_limit_report.md >> $GITHUB_STEP_SUMMARY

      - name: Post or Update Daily Limit PR Comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('daily_limit_report.md')) {
              const report = fs.readFileSync('daily_limit_report.md', 'utf8');
              const commentTag = '<!-- commitrush-daily-limit-status -->';
              const body = `${commentTag}\n${report}\n\n*Note: Contributions that reach the daily limit can still be merged normally if code is approved, but receive 0 competition points.*`;

              const comments = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number
              });

              const existingComment = comments.data.find(c => c.body.includes(commentTag));

              if (existingComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existingComment.id,
                  body: body
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: body
                });
              }
            }
